name: Apply KernelSU runtime bridge fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply patch
        run: python3 .github/scripts/apply-ksu-runtime-bridge-fix.py

      - name: Validate source and build
        run: |
          set -euo pipefail
          git diff --check
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Commit to main
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git add app/src/main/java/dev/busung/s25uroot app/src/test/java/dev/busung/s25uroot
          git commit -m "Fix post-KernelSU runtime bridge and root detection"
          git push origin HEAD:main
