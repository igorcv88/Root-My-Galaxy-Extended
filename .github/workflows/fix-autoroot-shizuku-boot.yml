name: One-shot Auto Root and Shizuku boot repair

on:
  push:
    branches:
      - main
    paths:
      - .github/autoroot-shizuku-fix-trigger

permissions:
  contents: write

concurrency:
  group: autoroot-shizuku-boot-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch, test and commit boot coordination repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Apply deterministic source repair
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_autoroot_shizuku_boot.py
          sed -i 's/private val SHIZUKU_LOG_POLL_INTERVAL = 1\.seconds/private val SHIZUKU_LOG_POLL_INTERVAL = 1_000.milliseconds/' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt

      - name: Verify transport and boot invariants
        run: |
          set -euo pipefail
          grep -F 'ShizukuController.awaitRunning(AUTO_ROOT_SHIZUKU_WAIT_MILLIS)' app/src/main/java/dev/busung/s25uroot/AutoRootExecutorService.kt
          grep -F 'AutoRootSupport.claimAttempt(this, bootToken)' app/src/main/java/dev/busung/s25uroot/AutoRootExecutorService.kt
          ! grep -F 'AutoRootSupport.claimAttempt(this, bootToken)' app/src/main/java/dev/busung/s25uroot/AutoRootService.kt
          grep -F 'ExploitRoutePolicy.SHELL_TRANSPORT' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          grep -F 'ShizukuProvider.enableMultiProcessSupport' app/src/main/java/dev/busung/s25uroot/RootMyGalaxyApplication.kt
          grep -F 'android:name=".RootMyGalaxyApplication"' app/src/main/AndroidManifest.xml
          ! grep -R -n -E 'ctl\.restart zygote|ksud soft-reboot' app/src/main/java/dev/busung/s25uroot/AutoRoot*.kt

      - name: Test, lint and assemble release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Commit tested repair to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/java/dev/busung/s25uroot/AutoRootSupport.kt app/src/main/java/dev/busung/s25uroot/AutoRootService.kt app/src/main/java/dev/busung/s25uroot/AutoRootExecutorService.kt app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt app/src/main/java/dev/busung/s25uroot/ShizukuBootService.kt app/src/main/java/dev/busung/s25uroot/RootMyGalaxyApplication.kt app/src/test/java/dev/busung/s25uroot/AutoRootShellTransportContractTest.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Fix Auto Root shell transport and Shizuku boot ordering"
          git pull --rebase origin main
          git push origin HEAD:main
