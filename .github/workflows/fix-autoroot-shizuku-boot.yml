name: One-shot Auto Root and Shizuku boot repair

on:
  push:
    branches:
      - main
    paths:
      - .github/autoroot-shizuku-fix-trigger

permissions:
  contents: write

concurrency:
  group: autoroot-shizuku-boot-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch, test and commit boot coordination repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Apply deterministic source repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Patch anchor is not unique in {path}')
              write(path, text.replace(old, new, 1))

          # 1) AutoRootSupport: expose the verified target transport dependency.
          path = 'app/src/main/java/dev/busung/s25uroot/AutoRootSupport.kt'
          text = read(path)
          marker = '    fun verifiedBootToken(context: Context): String? {'
          insert = '''    /**
           * Target transport prerequisite from the exact, last-known-good offline profile.
           * This is read before the exploit window so shell-dependent targets can bring
           * Shizuku up first instead of racing it. The actual executor revalidates the
           * same cache again before claiming the once-per-boot exploit attempt.
           */
          fun requiresShellTransport(context: Context): Boolean =
              KnownGoodPayloadStore.load(context).profile.routePolicy.prefersShellTransport

          '''
          if marker not in text:
              raise SystemExit('AutoRootSupport insertion anchor missing')
          if 'fun requiresShellTransport(context: Context)' not in text:
              text = text.replace(marker, insert + marker, 1)
          write(path, text)

          # 2) AutoRootService: start the transport prerequisite early and defer
          # once-per-boot attempt consumption to the executor.
          path = 'app/src/main/java/dev/busung/s25uroot/AutoRootService.kt'
          replace_once(
              path,
              '''            require(AutoRootSupport.hasVerifiedInstall(this)) {
                  getString(R.string.autoroot_prior_install_required)
              }

              if (NativeProbe.isKernelSuActive()) {''',
              '''            require(AutoRootSupport.hasVerifiedInstall(this)) {
                  getString(R.string.autoroot_prior_install_required)
              }

              val shellTransportRequired = AutoRootSupport.requiresShellTransport(this)
              if (shellTransportRequired) {
                  // On ZZI4 the exploit route needs u:r:shell:s0 for tracefs. Start
                  // Shizuku before the uptime gate instead of letting the two boot
                  // automations race each other.
                  ShizukuBootService.startForAutoRoot(this)
                  Log.i(TAG, "Auto Root target requires shell transport; prioritizing Shizuku bootstrap")
              }

              if (NativeProbe.isKernelSuActive()) {''',
          )
          replace_once(
              path,
              '''            // Consume the once-per-boot attempt only when execution is actually
              // ready to hand off. A killed gate during the stabilization wait no
              // longer burns the only automatic attempt for the boot.
              require(AutoRootSupport.claimAttempt(this, bootToken)) {
                  getString(R.string.autoroot_already_attempted)
              }

              pendingBootToken = bootToken''',
              '''            // Do not consume the once-per-boot exploit attempt here. The fresh
              // executor claims it only after the exact target has been loaded and
              // any shell transport prerequisite is actually ready.
              pendingBootToken = bootToken''',
          )

          # 3) AutoRootExecutorService: shell-required target waits for an authorized
          # Shizuku Binder before claiming the attempt.
          path = 'app/src/main/java/dev/busung/s25uroot/AutoRootExecutorService.kt'
          replace_once(
              path,
              ''' * BIND_IMPORTANT | BIND_ABOVE_CLIENT. Auto Root is always offline and always
           * standalone. onBind() has no execution side effect: the gate must first connect
           * and then send an explicit start command over Messenger.''',
              ''' * BIND_IMPORTANT | BIND_ABOVE_CLIENT. Auto Root is always offline. Legacy
           * targets remain standalone; targets whose route policy requires shell wait for
           * the boot Shizuku transport before consuming their once-per-boot exploit attempt.
           * onBind() has no execution side effect: the gate must first connect and then send
           * an explicit start command over Messenger.''',
          )
          replace_once(
              path,
              '''            historyEntry = InstallHistoryEntry(
                  id = UUID.randomUUID().toString(),
                  startedAtMillis = System.currentTimeMillis(),
                  completedAtMillis = null,
                  result = InstallRunResult.Running,
                  profileId = null,
                  usedShizuku = false,
                  log = "[*] Auto Root started: fresh executor, offline cache, standalone transport",
              )

              val payloads = AutoRootSupport.loadVerifiedLocalPayloads(this)
              require(payloads.source == PayloadSource.Offline) {
                  "Auto Root requires the last-known-good offline payload"
              }
              val currentHistory = historyEntry ?: error("Auto Root history state missing")
              historyEntry = currentHistory.copy(
                  profileId = payloads.profile.profileId,
                  log = currentHistory.log + "\\n[*] profile=${payloads.profile.profileId}",
              )

              var lastRunnerSnapshot = ""''',
              '''            historyEntry = InstallHistoryEntry(
                  id = UUID.randomUUID().toString(),
                  startedAtMillis = System.currentTimeMillis(),
                  completedAtMillis = null,
                  result = InstallRunResult.Running,
                  profileId = null,
                  usedShizuku = false,
                  log = "[*] Auto Root started: fresh executor, offline cache",
              )

              val payloads = AutoRootSupport.loadVerifiedLocalPayloads(this)
              require(payloads.source == PayloadSource.Offline) {
                  "Auto Root requires the last-known-good offline payload"
              }
              val shellTransportRequired = payloads.profile.routePolicy.prefersShellTransport
              val currentHistory = historyEntry ?: error("Auto Root history state missing")
              historyEntry = currentHistory.copy(
                  profileId = payloads.profile.profileId,
                  usedShizuku = shellTransportRequired,
                  log = currentHistory.log +
                      "\\n[*] profile=${payloads.profile.profileId} transport=" +
                      if (shellTransportRequired) "shell-required" else "standalone",
              )

              if (shellTransportRequired) {
                  updateNotification(getString(R.string.autoroot_preparing_exploit))
                  appendHistory("[*] Waiting for Shizuku shell transport required by target policy")
                  ShizukuBootService.startForAutoRoot(this)
                  require(ShizukuController.awaitRunning(AUTO_ROOT_SHIZUKU_WAIT_MILLIS)) {
                      "Shizuku did not become available for the shell-required Auto Root route"
                  }
                  require(ShizukuController.isGranted()) {
                      "Root My Galaxy is not authorized to use Shizuku for the shell-required Auto Root route"
                  }
                  appendHistory("[+] Shizuku shell transport is ready")
              }

              require(AutoRootSupport.claimAttempt(this, bootToken)) {
                  getString(R.string.autoroot_already_attempted)
              }
              appendHistory("[*] Once-per-boot exploit attempt claimed after transport readiness")

              var lastRunnerSnapshot = ""''',
          )
          replace_once(
              path,
              '''        private const val TAG = "RootMyGalaxyAutoRootExec"
              private const val MAX_EXECUTOR_WAKELOCK_MILLIS = 20 * 60 * 1_000L''',
              '''        private const val TAG = "RootMyGalaxyAutoRootExec"
              private const val AUTO_ROOT_SHIZUKU_WAIT_MILLIS = 90_000L
              private const val MAX_EXECUTOR_WAKELOCK_MILLIS = 20 * 60 * 1_000L''',
          )

          # 4) AutoRootRunner: actually honor shell transport and execute the same
          # helper/payload path through Shizuku as Manual does.
          path = 'app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt'
          replace_once(
              path,
              '''/**
           * Auto Root executes the last-known-good payload in a fresh standalone process.
           * KernelSU is expected to auto-late-load from the UMH root helper as soon as
           * bootstrap root lands. The historical client stage/--late-load path remains a
           * fallback when the persisted /data/local/tmp ksud is unavailable.
           */''',
              '''/**
           * Auto Root executes the exact last-known-good offline payload from a fresh
           * executor. Legacy targets use the app transport; a target whose route policy
           * prefers shell is fail-closed onto Shizuku shell so tracefs is never silently
           * attempted from an untrusted-app SELinux domain.
           *
           * KernelSU is expected to auto-late-load from the UMH root helper as soon as
           * bootstrap root lands. The historical client stage/--late-load path remains a
           * fallback when the persisted /data/local/tmp ksud is unavailable.
           */''',
          )
          replace_once(
              path,
              '''        onStage(AutoRootStage.PreparingExploit)
              onLog("[*] profile=${payloads.profile.profileId} transport=standalone source=offline")

              onStage(AutoRootStage.RunningExploit)
              executeExploit(payloads.exploit, bootToken, payloads.profile.routePolicy)''',
              '''        val useShellTransport = payloads.profile.routePolicy.prefersShellTransport
              val transport = if (useShellTransport) {
                  ExploitRoutePolicy.SHELL_TRANSPORT
              } else {
                  ExploitRoutePolicy.APP_TRANSPORT
              }

              onStage(AutoRootStage.PreparingExploit)
              onLog("[*] profile=${payloads.profile.profileId} transport=$transport source=offline")

              onStage(AutoRootStage.RunningExploit)
              executeExploit(
                  payloads.exploit,
                  bootToken,
                  payloads.profile.routePolicy,
                  useShellTransport,
              )''',
          )
          text = read(path)
          start = text.index('    private suspend fun executeExploit(')
          end = text.index('    private suspend fun stageKernelSuRequired', start)
          new_execute = r'''    private suspend fun executeExploit(
              payload: File,
              bootToken: String,
              policy: ExploitRoutePolicy,
              useShellTransport: Boolean,
          ) {
              val transport = if (useShellTransport) {
                  ExploitRoutePolicy.SHELL_TRANSPORT
              } else {
                  ExploitRoutePolicy.APP_TRANSPORT
              }
              onLog(policy.describe(transport))

              val localLogFile = File(context.filesDir, "autoroot-exploit.log")
              if (!useShellTransport) localLogFile.delete()

              val localHelper = helperFile()
              require(localHelper.canExecute()) { context.getString(R.string.error_helper_unavailable) }

              val originalThreadPriority = runCatching {
                  Process.getThreadPriority(Process.myTid())
              }.getOrDefault(Process.THREAD_PRIORITY_DEFAULT)

              runCatching { Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_DISPLAY) }
              val process = try {
                  val launched = if (useShellTransport) {
                      require(ShizukuController.isGranted()) {
                          "Shizuku shell transport is not authorized"
                      }

                      val cleanup = ShizukuController.exec(
                          arrayOf("rm", "-f", SHIZUKU_LOG_PATH),
                      )
                      try {
                          require(cleanup.waitFor() == 0) {
                              "Unable to clear the Auto Root shell log"
                          }
                      } finally {
                          if (cleanup.isAlive) cleanup.destroy()
                      }

                      val stagedHelper = shizukuStage(localHelper, SHIZUKU_HELPER_PATH)
                      val stagedPayload = shizukuStage(payload, SHIZUKU_PAYLOAD_PATH)
                      ShizukuController.exec(
                          arrayOf(
                              stagedHelper.absolutePath,
                              "--run-payload",
                              stagedPayload.absolutePath,
                              stagedHelper.absolutePath,
                              SHIZUKU_LOG_PATH,
                          ),
                          shizukuEnvironment(bootToken, stagedHelper.absolutePath, policy),
                          "/data/local/tmp",
                      )
                  } else {
                      val processBuilder = ProcessBuilder(
                          localHelper.absolutePath,
                          "--run-payload",
                          payload.absolutePath,
                          localHelper.absolutePath,
                          localLogFile.absolutePath,
                      ).redirectErrorStream(true)
                      processBuilder.environment().putAll(
                          policy.environment(cachedP0Offset(bootToken)),
                      )
                      processBuilder.start()
                  }

                  launched.also {
                      val lowered = runCatching {
                          Process.setThreadPriority(Process.THREAD_PRIORITY_BACKGROUND)
                      }.isSuccess
                      if (!lowered) runCatching {
                          Process.setThreadPriority(originalThreadPriority)
                      }
                  }
              } catch (error: Throwable) {
                  runCatching { Process.setThreadPriority(originalThreadPriority) }
                  throw error
              }

              val captured = StringBuilder()
              fun readLog(): String {
                  drainProcessOutput(process, captured)
                  return if (useShellTransport) {
                      captured.toString()
                  } else {
                      localLogFile.readTextIfPresent()
                  }
              }

              try {
                  val startedAt = SystemClock.elapsedRealtime()
                  var lastProgressAt = startedAt
                  var lastRawLog = ""
                  while (process.isAlive) {
                      val rawLog = readLog()
                      if (rawLog != lastRawLog) {
                          publishExploitLog(rawLog)
                          lastRawLog = rawLog
                          lastProgressAt = SystemClock.elapsedRealtime()
                      }
                      val now = SystemClock.elapsedRealtime()
                      require(now - lastProgressAt < EXPLOIT_STALL_MILLIS) {
                          context.getString(R.string.error_exploit_stalled)
                      }
                      require(now - startedAt < EXPLOIT_TOTAL_MILLIS) {
                          context.getString(R.string.error_exploit_timeout)
                      }
                      delay(
                          if (useShellTransport) {
                              SHIZUKU_LOG_POLL_INTERVAL
                          } else {
                              LOG_POLL_INTERVAL
                          },
                      )
                  }

                  val exitCode = process.waitFor()
                  val rawLog = readLog()
                  publishExploitLog(rawLog)
                  if (policy.p0OffsetCache) cacheP0Offset(bootToken, rawLog)

                  val earlyOutput = captured.toString().trim()
                  require(exitCode == 0) {
                      context.getString(
                          R.string.error_payload_exit,
                          exitCode,
                          earlyOutput.takeIf(String::isNotBlank)?.let { " ($it)" } ?: "",
                      )
                  }
                  require(rawLog.contains("exploit completed") && rawLog.contains("done=1 root=1")) {
                      context.getString(R.string.error_success_marker)
                  }
              } finally {
                  if (process.isAlive) {
                      process.destroy()
                      delay(500.milliseconds)
                      if (process.isAlive) process.destroyForcibly()
                  }
                  runCatching { Process.setThreadPriority(originalThreadPriority) }
              }
              onLog(context.getString(R.string.log_bootstrap_root))
          }

          private fun shizukuStage(source: File, target: String): File {
              try {
                  ShizukuController.writeFile(target, "755", source.inputStream())
              } catch (error: Throwable) {
                  throw IllegalStateException(
                      "Unable to stage Auto Root shell artifact $target: ${error.message.orEmpty()}",
                      error,
                  )
              }
              return File(target)
          }

          private fun shizukuEnvironment(
              bootToken: String,
              helperPath: String,
              policy: ExploitRoutePolicy,
          ): Array<String> = buildList {
              add("CVE43499_ROOT_HELPER=$helperPath")
              policy.environment(cachedP0Offset(bootToken)).forEach { (key, value) ->
                  add("$key=$value")
              }
          }.toTypedArray()

          '''
          text = text[:start] + new_execute + text[end:]
          old_constants = '''        private const val KSUD_STAGE_REFRESH_PATH = "/data/local/tmp/.ksud-stage-refresh"
              private val LOG_POLL_INTERVAL = 250.milliseconds'''
          new_constants = '''        private const val KSUD_STAGE_REFRESH_PATH = "/data/local/tmp/.ksud-stage-refresh"
              private const val SHIZUKU_LOG_PATH = "/data/local/tmp/autoroot-exploit.log"
              private const val SHIZUKU_HELPER_PATH = "/data/local/tmp/autoroot-helper"
              private const val SHIZUKU_PAYLOAD_PATH = "/data/local/tmp/autoroot-payload"
              private val LOG_POLL_INTERVAL = 250.milliseconds
              private val SHIZUKU_LOG_POLL_INTERVAL = 1.seconds'''
          if old_constants not in text:
              raise SystemExit('AutoRootRunner constant anchor missing')
          text = text.replace(old_constants, new_constants, 1)
          write(path, text)

          # 5) Shizuku boot coordinator: RMG takes over quickly instead of waiting
          # on the fork's WorkManager path, and a shell-dependent Auto Root is the
          # consumer of Shizuku rather than a competing critical section.
          path = 'app/src/main/java/dev/busung/s25uroot/ShizukuBootService.kt'
          replace_once(
              path,
              ''' * Auto Root remains independent. If Wi-Fi only appears near the configured
           * exploit gate, RMG yields through a small critical window rather than starting
           * mDNS/ADB beside the exploit.''',
              ''' * For targets whose Auto Root route requires shell, Shizuku is a prerequisite:
           * RMG therefore prioritizes this bootstrap and Auto Root waits for it. Legacy targets
           * keep the old critical-window guard so mDNS/ADB still does not perturb their exploit.''',
          )
          replace_once(
              path,
              '''class ShizukuBootService : Service() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private var bootstrapJob: Job? = null''',
              '''class ShizukuBootService : Service() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private var bootstrapJob: Job? = null
              @Volatile private var autoRootPriority = false''',
          )
          replace_once(
              path,
              '''    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
              if (!isConfigured(this)) {
                  stopSelf(startId)
                  return START_NOT_STICKY
              }
              if (bootstrapJob?.isActive == true) return START_NOT_STICKY''',
              '''    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
              if (intent?.getBooleanExtra(EXTRA_AUTO_ROOT_PRIORITY, false) == true) {
                  autoRootPriority = true
                  Log.i(TAG, "Auto Root requested priority Shizuku bootstrap")
              }
              if (!shouldRun()) {
                  stopSelf(startId)
                  return START_NOT_STICKY
              }
              if (bootstrapJob?.isActive == true) return START_NOT_STICKY''',
          )
          replace_once(
              path,
              '''        // If the fork's own BOOT_COMPLETED receiver is enabled, give its unique
              // WorkManager job a longer head start. With Tasker/other starters we still
              // provide a short generic grace period. This makes dual configuration a
              // redundancy setup rather than an immediate two-starter race.
              val externalBootStarter = ShizukuIntentStarter.isShizukuBootReceiverEnabled(this)
              val coexistenceGrace = if (externalBootStarter) {
                  SHIZUKU_OWN_BOOT_GRACE_MILLIS
              } else {
                  GENERIC_STARTER_GRACE_MILLIS
              }''',
              '''        if (autoRootRequiresShellTransport()) {
                  autoRootPriority = true
                  Log.i(TAG, "Shell-dependent Auto Root detected; Shizuku bootstrap owns boot priority")
              }

              // Give another starter only a short chance. The fork's ADB path is a
              // WorkManager job and can be scheduler-delayed after BOOT_COMPLETED;
              // RMG must not wait on that scheduler when its own paired ADB path is available.
              val externalBootStarter = ShizukuIntentStarter.isShizukuBootReceiverEnabled(this)
              val coexistenceGrace = when {
                  autoRootPriority -> AUTO_ROOT_STARTER_GRACE_MILLIS
                  externalBootStarter -> SHIZUKU_OWN_BOOT_GRACE_MILLIS
                  else -> GENERIC_STARTER_GRACE_MILLIS
              }''',
          )
          replace_once(
              path,
              '''        while (currentCoroutineContext().isActive && isConfigured(this)) {''',
              '''        while (currentCoroutineContext().isActive && shouldRun()) {''',
          )
          replace_once(
              path,
              '''    private fun autoRootCriticalDelayMillis(): Long {
              if (!AppPreferences.autoRootEnabled(this)) return 0L
              val gate = AppPreferences.autoRootBootMinUptimeSeconds(this) * 1_000L''',
              '''    private fun autoRootCriticalDelayMillis(): Long {
              if (!AppPreferences.autoRootEnabled(this)) return 0L
              if (autoRootPriority || autoRootRequiresShellTransport()) return 0L
              val gate = AppPreferences.autoRootBootMinUptimeSeconds(this) * 1_000L''',
          )
          marker = '    private fun looksLikePairingLoss(message: String): Boolean {'
          text = read(path)
          helper = '''    private fun autoRootRequiresShellTransport(): Boolean =
              AppPreferences.autoRootEnabled(this) &&
                  runCatching { AutoRootSupport.requiresShellTransport(this) }.getOrDefault(false)

          private fun shouldRun(): Boolean =
              autoRootPriority || AppPreferences.startShizukuOnBoot(this)

          '''
          if marker not in text:
              raise SystemExit('ShizukuBootService helper insertion anchor missing')
          if 'private fun shouldRun(): Boolean' not in text:
              text = text.replace(marker, helper + marker, 1)
          write(path, text)
          replace_once(
              path,
              '''        private const val BINDER_INITIAL_PROBE_MILLIS = 1_500L
              private const val GENERIC_STARTER_GRACE_MILLIS = 4_000L
              private const val SHIZUKU_OWN_BOOT_GRACE_MILLIS = 20_000L
              private const val AFTER_WIFI_COEXISTENCE_GRACE_MILLIS = 5_000L''',
              '''        private const val BINDER_INITIAL_PROBE_MILLIS = 1_500L
              private const val AUTO_ROOT_STARTER_GRACE_MILLIS = 750L
              private const val GENERIC_STARTER_GRACE_MILLIS = 1_500L
              private const val SHIZUKU_OWN_BOOT_GRACE_MILLIS = 2_000L
              private const val AFTER_WIFI_COEXISTENCE_GRACE_MILLIS = 1_000L''',
          )
          text = read(path)
          start = text.index('        fun startIfConfigured(context: Context) {')
          end = text.index('    }\n}', start)
          replacement = '''        fun startIfConfigured(context: Context) {
              if (!AppPreferences.startShizukuOnBoot(context)) return
              context.startForegroundService(Intent(context, ShizukuBootService::class.java))
          }

          fun startForAutoRoot(context: Context) {
              context.startForegroundService(
                  Intent(context, ShizukuBootService::class.java)
                      .putExtra(EXTRA_AUTO_ROOT_PRIORITY, true),
              )
          }

          fun stop(context: Context) {
              context.stopService(Intent(context, ShizukuBootService::class.java))
          }

          private const val EXTRA_AUTO_ROOT_PRIORITY =
              "dev.busung.s25uroot.extra.SHIZUKU_BOOT_AUTO_ROOT_PRIORITY"
      }'''
          text = text[:start] + replacement + text[end + len('    }'):]
          write(path, text)

          # 6) Enable official Shizuku API multi-process Binder sharing before
          # providers/services initialize in main, :autoroot_gate and :autoroot_exec.
          app_class = root / 'app/src/main/java/dev/busung/s25uroot/RootMyGalaxyApplication.kt'
          app_class.write_text('''package dev.busung.s25uroot

          import android.app.Application
          import android.content.Context
          import rikka.shizuku.ShizukuProvider

          class RootMyGalaxyApplication : Application() {
              override fun attachBaseContext(base: Context) {
                  // ShizukuProvider is hosted in the default app process. Secondary
                  // Auto Root processes must ask that provider process for its Binder.
                  ShizukuProvider.enableMultiProcessSupport(
                      Application.getProcessName() == base.packageName,
                  )
                  super.attachBaseContext(base)
              }
          }
          '''.replace('          ', ''), encoding='utf-8')

          path = 'app/src/main/AndroidManifest.xml'
          replace_once(
              path,
              '''    <application
              android:allowBackup="false"''',
              '''    <application
              android:name=".RootMyGalaxyApplication"
              android:allowBackup="false"''',
          )

          # 7) Regression contract tests. These intentionally protect ordering and
          # transport invariants that ordinary JVM tests cannot exercise on hardware.
          test = root / 'app/src/test/java/dev/busung/s25uroot/AutoRootShellTransportContractTest.kt'
          test.write_text(r'''package dev.busung.s25uroot

          import java.io.File
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class AutoRootShellTransportContractTest {
              private fun source(name: String): String {
                  val relative = "src/main/java/dev/busung/s25uroot/$name"
                  val candidates = listOf(File(relative), File("app/$relative"))
                  return candidates.firstOrNull(File::isFile)?.readText()
                      ?: error("Unable to locate $relative from ${File(".").absolutePath}")
              }

              private fun manifest(): String {
                  val candidates = listOf(
                      File("src/main/AndroidManifest.xml"),
                      File("app/src/main/AndroidManifest.xml"),
                  )
                  return candidates.firstOrNull(File::isFile)?.readText()
                      ?: error("Unable to locate AndroidManifest.xml")
              }

              @Test
              fun shellRequiredAutoRootWaitsBeforeClaimingAttempt() {
                  val executor = source("AutoRootExecutorService.kt")
                  val wait = executor.indexOf(
                      "ShizukuController.awaitRunning(AUTO_ROOT_SHIZUKU_WAIT_MILLIS)",
                  )
                  val grant = executor.indexOf("ShizukuController.isGranted()", wait)
                  val claim = executor.indexOf("AutoRootSupport.claimAttempt(this, bootToken)")
                  assertTrue(wait >= 0)
                  assertTrue(grant > wait)
                  assertTrue(claim > grant)

                  val gate = source("AutoRootService.kt")
                  assertFalse(gate.contains("AutoRootSupport.claimAttempt(this, bootToken)"))
              }

              @Test
              fun autoRootRunnerHonorsShellRouteInsteadOfAppFallback() {
                  val runner = source("AutoRootRunner.kt")
                  assertTrue(runner.contains("payloads.profile.routePolicy.prefersShellTransport"))
                  assertTrue(runner.contains("ExploitRoutePolicy.SHELL_TRANSPORT"))
                  assertTrue(runner.contains("ShizukuController.exec("))
                  assertTrue(runner.contains("shizukuStage(localHelper, SHIZUKU_HELPER_PATH)"))
                  assertFalse(runner.contains("never claims the shell transport"))
              }

              @Test
              fun shizukuBootDoesNotYieldToItsAutoRootConsumer() {
                  val service = source("ShizukuBootService.kt")
                  assertTrue(service.contains("autoRootPriority || autoRootRequiresShellTransport()"))
                  assertTrue(service.contains("fun startForAutoRoot(context: Context)"))
