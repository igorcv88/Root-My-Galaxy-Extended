name: Apply Shizuku settings UI patch

on:
  push:
    branches: [main]
    paths:
      - .github/shizuku-ui-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Insert Shizuku boot settings card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/dev/busung/s25uroot/MainActivity.kt')
          s = p.read_text()
          needle = '''        }
                  item { SectionLabel(stringResource(R.string.root_runtime_settings)) }
          '''
          replacement = '''        }
                  item { SectionLabel(stringResource(R.string.shizuku_boot_section)) }
                  item { ShizukuBootSettingsCard() }
                  item { SectionLabel(stringResource(R.string.root_runtime_settings)) }
          '''
          if s.count(needle) != 1:
              raise SystemExit(f'expected one insertion point, found {s.count(needle)}')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/dev/busung/s25uroot/MainActivity.kt; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/dev/busung/s25uroot/MainActivity.kt
          git commit -m 'Expose Shizuku boot startup settings'
          git push
