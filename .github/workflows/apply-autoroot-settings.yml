name: Apply Auto Root Settings UX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-autoroot-settings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Auto Root settings migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          main_path = Path('app/src/main/java/dev/busung/s25uroot/MainActivity.kt')
          s = main_path.read_text()

          s = replace_once(
              s,
              'import android.content.Context\n',
              'import android.Manifest\nimport android.content.Context\nimport android.content.pm.PackageManager\n',
              'MainActivity Android imports',
          )
          s = replace_once(
              s,
              'import androidx.lifecycle.compose.collectAsStateWithLifecycle\n',
              'import androidx.core.content.ContextCompat\nimport androidx.lifecycle.compose.collectAsStateWithLifecycle\n',
              'MainActivity ContextCompat import',
          )
          s = replace_once(
              s,
              '    private var shizukuMode by mutableStateOf(false)\n    private var softRebootAfterRoot by mutableStateOf(false)\n',
              '    private var shizukuMode by mutableStateOf(false)\n    private var autoRootEnabled by mutableStateOf(false)\n    private var softRebootAfterRoot by mutableStateOf(false)\n',
              'MainActivity Auto Root state',
          )
          s = replace_once(
              s,
              '        shizukuMode = AppPreferences.shizukuMode(this)\n        softRebootAfterRoot = AppPreferences.softRebootAfterRoot(this)\n',
              '        shizukuMode = AppPreferences.shizukuMode(this)\n        autoRootEnabled = AppPreferences.autoRootEnabled(this)\n        softRebootAfterRoot = AppPreferences.softRebootAfterRoot(this)\n',
              'MainActivity Auto Root load',
          )
          s = replace_once(
              s,
              '                    shizukuMode = shizukuMode,\n                    softRebootAfterRoot = softRebootAfterRoot,\n',
              '                    shizukuMode = shizukuMode,\n                    autoRootEnabled = autoRootEnabled,\n                    softRebootAfterRoot = softRebootAfterRoot,\n',
              'RootApp Auto Root prop call',
          )
          s = replace_once(
              s,
              '                    onShizukuModeChanged = { enabled ->\n                        AppPreferences.setShizukuMode(this, enabled)\n                        shizukuMode = enabled\n                    },\n                    onSoftRebootAfterRootChanged = { enabled ->\n',
              '                    onShizukuModeChanged = { enabled ->\n                        AppPreferences.setShizukuMode(this, enabled)\n                        shizukuMode = enabled\n                    },\n                    onAutoRootEnabledChanged = { enabled ->\n                        AppPreferences.setAutoRootEnabled(this, enabled)\n                        autoRootEnabled = enabled\n                    },\n                    onSoftRebootAfterRootChanged = { enabled ->\n',
              'RootApp Auto Root callback call',
          )
          s = replace_once(
              s,
              '    shizukuMode: Boolean,\n    softRebootAfterRoot: Boolean,\n',
              '    shizukuMode: Boolean,\n    autoRootEnabled: Boolean,\n    softRebootAfterRoot: Boolean,\n',
              'RootApp Auto Root prop',
          )
          s = replace_once(
              s,
              '    onShizukuModeChanged: (Boolean) -> Unit,\n    onSoftRebootAfterRootChanged: (Boolean) -> Unit,\n',
              '    onShizukuModeChanged: (Boolean) -> Unit,\n    onAutoRootEnabledChanged: (Boolean) -> Unit,\n    onSoftRebootAfterRootChanged: (Boolean) -> Unit,\n',
              'RootApp Auto Root callback',
          )
          s = replace_once(
              s,
              '                    shizukuMode = shizukuMode,\n                    softRebootAfterRoot = softRebootAfterRoot,\n                    czg3BootMinUptimeSeconds = czg3BootMinUptimeSeconds,\n',
              '                    shizukuMode = shizukuMode,\n                    autoRootEnabled = autoRootEnabled,\n                    softRebootAfterRoot = softRebootAfterRoot,\n                    czg3BootMinUptimeSeconds = czg3BootMinUptimeSeconds,\n',
              'SettingsPage Auto Root prop call',
          )
          s = replace_once(
              s,
              '                    onShizukuModeChanged = onShizukuModeChanged,\n                    onSoftRebootAfterRootChanged = onSoftRebootAfterRootChanged,\n',
              '                    onShizukuModeChanged = onShizukuModeChanged,\n                    onAutoRootEnabledChanged = onAutoRootEnabledChanged,\n                    onSoftRebootAfterRootChanged = onSoftRebootAfterRootChanged,\n',
              'SettingsPage Auto Root callback call',
          )
          s = replace_once(
              s,
              '    shizukuMode: Boolean,\n    softRebootAfterRoot: Boolean,\n    czg3BootMinUptimeSeconds: Int,\n',
              '    shizukuMode: Boolean,\n    autoRootEnabled: Boolean,\n    softRebootAfterRoot: Boolean,\n    czg3BootMinUptimeSeconds: Int,\n',
              'SettingsPage Auto Root prop',
          )
          s = replace_once(
              s,
              '    onShizukuModeChanged: (Boolean) -> Unit,\n    onSoftRebootAfterRootChanged: (Boolean) -> Unit,\n    onCzg3BootMinUptimeChanged: (Int) -> Unit,\n) {\n',
              '    onShizukuModeChanged: (Boolean) -> Unit,\n    onAutoRootEnabledChanged: (Boolean) -> Unit,\n    onSoftRebootAfterRootChanged: (Boolean) -> Unit,\n    onCzg3BootMinUptimeChanged: (Int) -> Unit,\n) {\n',
              'SettingsPage Auto Root callback',
          )
          s = replace_once(
              s,
              '    var showAboutDialog by remember { mutableStateOf(false) }\n    var showShizukuMissingDialog by remember { mutableStateOf(false) }\n',
              '    var showAboutDialog by remember { mutableStateOf(false) }\n    var showShizukuMissingDialog by remember { mutableStateOf(false) }\n    var showAutoRootNotReadyDialog by remember { mutableStateOf(false) }\n',
              'SettingsPage Auto Root dialog state',
          )
          anchor = '    val exactCzg3 = remember(device) { isExactCzg3(device) }\n\n'
          insertion = '''    val exactCzg3 = remember(device) { isExactCzg3(device) }\n    val notificationPermissionLauncher = rememberLauncherForActivityResult(\n        ActivityResultContracts.RequestPermission(),\n    ) { granted ->\n        if (!granted && autoRootEnabled) {\n            Toast.makeText(\n                context,\n                context.getString(R.string.autoroot_notification_permission),\n                Toast.LENGTH_LONG,\n            ).show()\n        }\n    }\n    val requestAutoRootNotifications: () -> Unit = {\n        if (\n            Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&\n            ContextCompat.checkSelfPermission(\n                context,\n                Manifest.permission.POST_NOTIFICATIONS,\n            ) != PackageManager.PERMISSION_GRANTED\n        ) {\n            notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n        }\n    }\n\n    if (showAutoRootNotReadyDialog) {\n        AlertDialog(\n            onDismissRequest = { showAutoRootNotReadyDialog = false },\n            icon = { Icon(Icons.Rounded.Security, contentDescription = null) },\n            title = {\n                DialogDimAmount(0.34f)\n                Text(stringResource(R.string.autoroot_not_ready_title))\n            },\n            text = { Text(stringResource(R.string.autoroot_not_ready_body)) },\n            confirmButton = {\n                FilledTonalButton(onClick = {\n                    clickHaptic(view)\n                    showAutoRootNotReadyDialog = false\n                    requestAutoRootNotifications()\n                }) {\n                    Text(stringResource(R.string.autoroot_not_ready_acknowledge))\n                }\n            },\n        )\n    }\n\n'''
          s = replace_once(s, anchor, insertion, 'SettingsPage Auto Root permission/dialog block')

          old_runtime = '''                SettingsSwitchCard(\n                    icon = Icons.Rounded.SystemUpdate,\n                    title = stringResource(R.string.soft_reboot_title),\n                    description = stringResource(R.string.soft_reboot_description),\n                    checked = softRebootAfterRoot,\n                    position = if (exactCzg3) SettingsCardPosition.Bottom else SettingsCardPosition.GroupedSingle,\n                    onCheckedChange = {\n                        clickHaptic(view)\n                        onSoftRebootAfterRootChanged(it)\n                    },\n                )\n'''
          new_runtime = '''                SettingsSwitchCard(\n                    icon = Icons.Rounded.Security,\n                    title = stringResource(R.string.autoroot_opt_in_title),\n                    description = stringResource(R.string.autoroot_opt_in_description),\n                    checked = autoRootEnabled,\n                    position = if (exactCzg3) SettingsCardPosition.Middle else SettingsCardPosition.Top,\n                    onCheckedChange = { enabled ->\n                        onAutoRootEnabledChanged(enabled)\n                        if (enabled) {\n                            if (AutoRootSupport.hasVerifiedInstall(context)) {\n                                requestAutoRootNotifications()\n                            } else {\n                                showAutoRootNotReadyDialog = true\n                            }\n                        }\n                    },\n                )\n                SettingsSwitchCard(\n                    icon = Icons.Rounded.SystemUpdate,\n                    title = stringResource(R.string.soft_reboot_title),\n                    description = stringResource(R.string.soft_reboot_description),\n                    checked = softRebootAfterRoot,\n                    position = SettingsCardPosition.Bottom,\n                    onCheckedChange = {\n                        clickHaptic(view)\n                        onSoftRebootAfterRootChanged(it)\n                    },\n                )\n'''
          s = replace_once(s, old_runtime, new_runtime, 'SettingsPage runtime Auto Root card')
          main_path.write_text(s)

          install_path = Path('app/src/main/java/dev/busung/s25uroot/InstallActivity.kt')
          s = install_path.read_text()
          for line in [
              'import android.Manifest\n',
              'import android.content.pm.PackageManager\n',
              'import android.widget.Toast\n',
              'import androidx.activity.compose.rememberLauncherForActivityResult\n',
              'import androidx.activity.result.contract.ActivityResultContracts\n',
              'import androidx.compose.material3.Switch\n',
              'import androidx.core.content.ContextCompat\n',
          ]:
              s = s.replace(line, '')

          start = s.index('                var autoRootEnabled by remember {')
          end = s.index('                if (startInstall && manualPayloadMode == null) {', start)
          s = s[:start] + s[end:]
          s = replace_once(
              s,
              '''                InstallScreen(\n                    installState = installState,\n                    autoRootEnabled = autoRootEnabled,\n                    onAutoRootEnabledChanged = setAutoRoot,\n                    onRetry = {\n''',
              '''                InstallScreen(\n                    installState = installState,\n                    onRetry = {\n''',
              'InstallScreen call Auto Root removal',
          )
          s = replace_once(
              s,
              '''private fun InstallScreen(\n    installState: InstallUiState,\n    autoRootEnabled: Boolean,\n    onAutoRootEnabledChanged: (Boolean) -> Unit,\n    onRetry: () -> Unit,\n''',
              '''private fun InstallScreen(\n    installState: InstallUiState,\n    onRetry: () -> Unit,\n''',
              'InstallScreen signature Auto Root removal',
          )
          card = '''            if (installState.phase == InstallPhase.Installed) {\n                AutoRootOptInCard(\n                    enabled = autoRootEnabled,\n                    onEnabledChanged = onAutoRootEnabledChanged,\n                )\n            }\n\n'''
          s = replace_once(s, card, '', 'Installer Auto Root card removal')
          start = s.index('@Composable\nprivate fun AutoRootOptInCard(')
          end = s.index('@Composable\nprivate fun InstallerStatusCard', start)
          s = s[:start] + s[end:]
          install_path.write_text(s)

          def patch_autoroot_strings(path, notification_old, notification_new, title, body):
              p = Path(path)
              text = p.read_text()
              text = replace_once(text, notification_old, notification_new, f'{path} notification wording')
              nl = chr(10)
              addition = nl.join([
                  f'    <string name="autoroot_not_ready_title">{title}</string>',
                  f'    <string name="autoroot_not_ready_body">{body}</string>',
                  '    <string name="autoroot_not_ready_acknowledge" translatable="false">OK</string>',
              ]) + nl
              text = replace_once(text, '</resources>' + nl, addition + '</resources>' + nl, f'{path} not-ready strings')
              p.write_text(text)

          patch_autoroot_strings(
              'app/src/main/res/values/strings_autoroot.xml',
              '    <string name="autoroot_notification_permission">Notification permission is required before Auto Root can be enabled.</string>\n',
              '    <string name="autoroot_notification_permission">Auto Root remains enabled, but progress notifications may be hidden until notification permission is granted.</string>\n',
              'Auto Root armed',
              'Auto Root is enabled, but it will not run until Manual Online completes successfully once and stores a verified payload cache.',
          )
          patch_autoroot_strings(
              'app/src/main/res/values-pt-rBR/strings_autoroot.xml',
              '    <string name="autoroot_notification_permission">A permissão de notificações é necessária antes de ativar o Auto Root.</string>\n',
              '    <string name="autoroot_notification_permission">O Auto Root continua ativado, mas as notificações de progresso podem ficar ocultas até você conceder a permissão de notificações.</string>\n',
              'Auto Root armado',
              'O Auto Root está ativado, mas só funcionará depois que uma execução Manual Online terminar com sucesso e salvar um cache de payload verificado.',
          )
          PY

          rm -f .github/workflows/apply-autoroot-settings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move Auto Root control to general settings"
          git push
