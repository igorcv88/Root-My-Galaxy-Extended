name: PR55 preflight

on:
  push:
    branches:
      - fix/zzi4-shared-route-policy

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and assemble release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease

      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git rm .github/workflows/pr55-preflight.yml
          git commit -m "ci: remove temporary PR55 preflight"
          git push origin HEAD:fix/zzi4-shared-route-policy
