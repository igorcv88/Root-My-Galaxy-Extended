name: Trigger RMG Release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-trigger

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch canonical APK release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
