name: Advanced recovery feature CI

on:
  push:
    branches:
      - feature/advanced-root-recovery

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Integrate Advanced recovery UI and guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def lines(*items):
              return "\n".join(items) + "\n"

          # MainActivity: rename the automatic post-root option and expose the
          # recovery tools only while Advanced mode is enabled.
          path = Path("app/src/main/java/dev/busung/s25uroot/MainActivity.kt")
          text = path.read_text()
          replacements = [
              ("softRebootAfterRoot", "restartZygoteAfterRoot"),
              ("onSoftRebootAfterRootChanged", "onRestartZygoteAfterRootChanged"),
              ("setSoftRebootAfterRoot", "setRestartZygoteAfterRoot"),
              ("R.string.soft_reboot_title", "R.string.restart_zygote_after_root_title"),
              ("R.string.soft_reboot_description", "R.string.restart_zygote_after_root_description"),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"Expected MainActivity token missing: {old}")

          call_old = lines(
              "                AppPage.Settings -> SettingsPage(",
              "                    padding = padding,",
              "                    device = device,",
              "                    accentColor = accentColor,",
          )
          call_new = lines(
              "                AppPage.Settings -> SettingsPage(",
              "                    padding = padding,",
              "                    device = device,",
              "                    installState = installState,",
              "                    accentColor = accentColor,",
          )
          if call_new not in text:
              if call_old not in text:
                  raise SystemExit("SettingsPage call anchor changed")
              text = text.replace(call_old, call_new, 1)

          sig_old = lines(
              "private fun SettingsPage(",
              "    padding: PaddingValues,",
              "    device: DeviceSnapshot,",
              "    accentColor: AccentColor,",
          )
          sig_new = lines(
              "private fun SettingsPage(",
              "    padding: PaddingValues,",
              "    device: DeviceSnapshot,",
              "    installState: InstallUiState,",
              "    accentColor: AccentColor,",
          )
          if sig_new not in text:
              if sig_old not in text:
                  raise SystemExit("SettingsPage signature anchor changed")
              text = text.replace(sig_old, sig_new, 1)

          advanced_old = lines(
              "        item {",
              "            SettingsSwitchCard(",
              "                icon = Icons.Rounded.Memory,",
              "                title = stringResource(R.string.advanced_mode),",
              "                description = stringResource(R.string.advanced_mode_description),",
              "                checked = advancedMode,",
              "                onCheckedChange = {",
              "                    clickHaptic(view)",
              "                    onAdvancedModeChanged(it)",
              "                },",
              "            )",
              "        }",
              "        item { SectionLabel(stringResource(R.string.about)) }",
          )
          advanced_new = lines(
              "        item {",
              "            SettingsSwitchCard(",
              "                icon = Icons.Rounded.Memory,",
              "                title = stringResource(R.string.advanced_mode),",
              "                description = stringResource(R.string.advanced_mode_description),",
              "                checked = advancedMode,",
              "                onCheckedChange = {",
              "                    clickHaptic(view)",
              "                    onAdvancedModeChanged(it)",
              "                },",
              "            )",
              "        }",
              "        if (advancedMode) {",
              "            item {",
              "                AdvancedRecoverySettings(",
              "                    rootActive = installState.phase == InstallPhase.Installed,",
              "                    autoRootEnabled = autoRootEnabled,",
              "                    onAutoRootEnabledChanged = onAutoRootEnabledChanged,",
              "                )",
              "            }",
              "        }",
              "        item { SectionLabel(stringResource(R.string.about)) }",
          )
          if advanced_new not in text:
              if advanced_old not in text:
                  raise SystemExit("Advanced section anchor changed")
              text = text.replace(advanced_old, advanced_new, 1)
          path.write_text(text)

          # Manual root must cross the same PID1/global mount-readiness boundary
          # as Auto Root before an automatic Zygote restart is allowed.
          path = Path("app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt")
          text = path.read_text()
          old_entry = lines(
              "    private suspend fun installKernelSu(payloads: VerifiedPayloads) {",
              "        val autoLoaded = waitForAutoLateLoad()",
          )
          new_entry = lines(
              "    private suspend fun installKernelSu(payloads: VerifiedPayloads) {",
              "        val bootToken = currentBootToken() ?: error(app.getString(R.string.error_boot_id))",
              "        val autoLoaded = waitForAutoLateLoad(bootToken)",
          )
          if new_entry not in text:
              if old_entry not in text:
                  raise SystemExit("InstallViewModel installKernelSu entry anchor changed")
              text = text.replace(old_entry, new_entry, 1)

          old_verify = lines(
              "        if (verification.code == 0 && verification.output.isNotBlank()) appendLog(verification.output)",
              "        storeInstallReceipt()",
              "        appendLog(app.getString(R.string.log_ksu_control_verified))",
              "    }",
              "",
              "    private suspend fun waitForAutoLateLoad(): Boolean {",
              "        val deadline = SystemClock.elapsedRealtime() + AUTO_LATE_LOAD_WAIT_MILLIS",
              "        while (SystemClock.elapsedRealtime() < deadline) {",
              "            val probe = runCatching { runHelper(\"--ksu-info\") }.getOrNull()",
              "            if (probe?.code == 0 || NativeProbe.isKernelSuActive()) return true",
              "            delay(AUTO_LATE_LOAD_POLL_INTERVAL)",
              "        }",
              "        return NativeProbe.isKernelSuActive()",
              "    }",
          )
          new_verify = lines(
              "        if (verification.code == 0 && verification.output.isNotBlank()) appendLog(verification.output)",
              "",
              "        val global = KernelSuGlobalReadiness.probe(app, bootToken)",
              "        require(global.exitCode == 0) {",
              "            app.getString(",
              "                R.string.error_ksu_verify,",
              "                global.exitCode,",
              "                global.output.ifBlank { \"KernelSU late-load global readiness is not satisfied\" },",
              "            )",
              "        }",
              "        if (global.output.isNotBlank()) appendLog(global.output)",
              "        storeInstallReceipt()",
              "        appendLog(app.getString(R.string.log_ksu_control_verified))",
              "    }",
              "",
              "    private suspend fun waitForAutoLateLoad(bootToken: String): Boolean {",
              "        val deadline = SystemClock.elapsedRealtime() + AUTO_LATE_LOAD_WAIT_MILLIS",
              "        var lastOutput = \"\"",
              "        while (SystemClock.elapsedRealtime() < deadline) {",
              "            val probe = runCatching { runHelper(\"--ksu-info\") }.getOrNull()",
              "            val controlActive = probe?.code == 0 || NativeProbe.isKernelSuActive()",
              "            if (controlActive) {",
              "                val global = runCatching { KernelSuGlobalReadiness.probe(app, bootToken) }.getOrNull()",
              "                if (global != null) {",
              "                    lastOutput = global.output",
              "                    if (global.exitCode == 0) {",
              "                        if (probe?.code == 0 && probe.output.isNotBlank()) appendLog(probe.output)",
              "                        if (global.output.isNotBlank()) appendLog(global.output)",
              "                        return true",
              "                    }",
              "                }",
              "            } else if (probe != null && probe.output.isNotBlank()) {",
              "                lastOutput = probe.output",
              "            }",
              "            delay(AUTO_LATE_LOAD_POLL_INTERVAL)",
              "        }",
              "        if (lastOutput.isNotBlank()) {",
              "            appendLog(\"[*] auto-late-load readiness probe: ${lastOutput.takeLast(320)}\")",
              "        }",
              "        return false",
              "    }",
          )
          if new_verify not in text:
              if old_verify not in text:
                  raise SystemExit("InstallViewModel global-readiness anchor changed")
              text = text.replace(old_verify, new_verify, 1)
          path.write_text(text)

          # UI state follows the durable unroot decision made by the recovery
          # action; do not rely on an asynchronous preference write before reboot.
          path = Path("app/src/main/java/dev/busung/s25uroot/AdvancedRecoverySettings.kt")
          text = path.read_text()
          old_unroot = lines(
              "                onConfirmed = {",
              "                    if (runningTool != null || !rootActive) return@HoldRecoveryCard",
              "                    val autoRootWasEnabled = autoRootEnabled",
              "                    if (autoRootWasEnabled) onAutoRootEnabledChanged(false)",
              "                    runTool(RecoveryTool.RebootUnroot) {",
              "                        val result = RootRecoveryActions.rebootAndUnroot(context)",
              "                        if (!result.accepted && autoRootWasEnabled) {",
              "                            onAutoRootEnabledChanged(true)",
              "                        }",
              "                        result",
              "                    }",
              "                },",
          )
          new_unroot = lines(
              "                onConfirmed = {",
              "                    if (runningTool != null || !rootActive) return@HoldRecoveryCard",
              "                    runTool(RecoveryTool.RebootUnroot) {",
              "                        val result = RootRecoveryActions.rebootAndUnroot(context)",
              "                        if (result.accepted) onAutoRootEnabledChanged(false)",
              "                        result",
              "                    }",
              "                },",
          )
          if new_unroot not in text:
              if old_unroot not in text:
                  raise SystemExit("AdvancedRecoverySettings unroot anchor changed")
              text = text.replace(old_unroot, new_unroot, 1)
          path.write_text(text)

          # The destructive action makes Auto Root=false durable before launching
          # the detached reboot and restores the old value if launch is rejected.
          path = Path("app/src/main/java/dev/busung/s25uroot/RootRecoveryActions.kt")
          text = path.read_text()
          old_reboot_entry = lines(
              "        val token = actionToken()",
              "        val scriptPath = \"/data/local/tmp/rmg-reboot-unroot-$token.sh\"",
          )
          new_reboot_entry = lines(
              "        val autoRootWasEnabled = AppPreferences.autoRootEnabled(context)",
              "        if (!AppPreferences.setAutoRootEnabledImmediately(context, false)) {",
              "            return@withContext RootRecoveryResult(",
              "                accepted = false,",
              "                detail = \"Unable to persist Auto Root disabled before reboot\",",
              "            )",
              "        }",
              "",
              "        val token = actionToken()",
              "        val scriptPath = \"/data/local/tmp/rmg-reboot-unroot-$token.sh\"",
          )
          # The token line occurs in several actions; scope to the reboot function.
          reboot_start = text.index("    suspend fun rebootAndUnroot(context: Context)")
          reboot_text = text[reboot_start:]
          if new_reboot_entry not in reboot_text:
              if old_reboot_entry not in reboot_text:
                  raise SystemExit("RootRecoveryActions reboot entry anchor changed")
              reboot_text = reboot_text.replace(old_reboot_entry, new_reboot_entry, 1)
              text = text[:reboot_start] + reboot_text

          old_launch = lines(
              "        if (!launch.accepted) launch else RootRecoveryResult(",
              "            accepted = true,",
              "            detail = \"Full reboot scheduled; the ephemeral KernelSU session will be cleared\",",
              "        )",
          )
          new_launch = lines(
              "        if (!launch.accepted) {",
              "            if (autoRootWasEnabled) AppPreferences.setAutoRootEnabledImmediately(context, true)",
              "            launch",
              "        } else {",
              "            RootRecoveryResult(",
              "                accepted = true,",
              "                detail = \"Full reboot scheduled; Auto Root disabled and ephemeral KernelSU will be cleared\",",
              "            )",
              "        }",
          )
          reboot_start = text.index("    suspend fun rebootAndUnroot(context: Context)")
          reboot_text = text[reboot_start:]
          if new_launch not in reboot_text:
              if old_launch not in reboot_text:
                  raise SystemExit("RootRecoveryActions reboot launch anchor changed")
              reboot_text = reboot_text.replace(old_launch, new_launch, 1)
              text = text[:reboot_start] + reboot_text
          path.write_text(text)
          PY

      - name: Verify post-root invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number -E 'AppPreferences\.(softRebootAfterRoot|setSoftRebootAfterRoot)' app/src/main/java; then
            echo "Obsolete automatic soft-reboot preference reference remains" >&2
            exit 1
          fi
          grep -F 'KernelSuGlobalReadiness.probe(app, bootToken)' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          grep -F 'setAutoRootEnabledImmediately(context, false)' app/src/main/java/dev/busung/s25uroot/RootRecoveryActions.kt
          grep -F 'RootRecoveryActions.restartZygote' app/src/main/java/dev/busung/s25uroot/AutoRootExecutorService.kt

      - name: Test, lint and assemble release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease

      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          generated=(
            app/src/main/java/dev/busung/s25uroot/MainActivity.kt
            app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
            app/src/main/java/dev/busung/s25uroot/AdvancedRecoverySettings.kt
            app/src/main/java/dev/busung/s25uroot/RootRecoveryActions.kt
          )
          if git diff --quiet -- "${generated[@]}"; then
            echo "Recovery integration already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${generated[@]}"
          git commit -m "Integrate guarded Advanced root recovery tools"
          git pull --rebase origin feature/advanced-root-recovery
          git push origin HEAD:feature/advanced-root-recovery
