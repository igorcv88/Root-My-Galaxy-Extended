name: Apply ZZI4 auto fallback fix

on:
  push:
    branches:
      - fix/zzi4-auto-fallback-autoroot
    paths:
      - .github/workflows/apply-zzi4-auto-fallback-fix.yml
      - .github/scripts/apply-zzi4-auto-fallback-fix.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zzi4-auto-fallback-fix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/zzi4-auto-fallback-autoroot
          fetch-depth: 0

      - name: Apply routing patch
        run: python3 .github/scripts/apply-zzi4-auto-fallback-fix.py

      - name: Verify routing markers
        run: |
          set -euo pipefail
          grep -F 'SLIDE_SOURCE=auto' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          grep -F 'p0_fallback=enabled' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          grep -F 'Shizuku tracefs unavailable; Auto Root is using the' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          grep -F 'SLIDE_SOURCE=auto' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          if grep -F 'tracefs-strict' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt; then
            echo 'strict tracefs marker unexpectedly remains' >&2
            exit 1
          fi

      - name: Run tests, lint, and release build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Commit patched app routing
        run: |
          set -euo pipefail
          git config user.name 'Root My Galaxy'
          git config user.email 'root-my-galaxy@users.noreply.github.com'
          git add app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt \
                  app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          git diff --cached --check
          git diff --cached --quiet && { echo 'No code changes'; exit 0; }
          git commit -m 'Use tracefs-first auto fallback for ZZI4 root flows'
          git push origin HEAD:fix/zzi4-auto-fallback-autoroot
