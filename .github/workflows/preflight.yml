name: RMG Preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/preflight-trigger
  pull_request:
    paths:
      - app/**
      - build.gradle*
      - settings.gradle*
      - gradle/**
      - gradlew*
      - .github/scripts/prepare_production_payload_bundle.py
      - .github/workflows/preflight.yml
      - .github/workflows/release.yml

permissions:
  contents: read

env:
  PAYLOAD_REPO: "igorcv88/Root-My-Galaxy-Payloads-Extended"

jobs:
  preflight:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare bundled production payload snapshot
        run: |
          set -euo pipefail
          PAYLOAD_CHECKOUT="$RUNNER_TEMP/root-my-galaxy-payloads"
          git clone --quiet --depth=1 --branch main \
            "https://github.com/${PAYLOAD_REPO}.git" \
            "$PAYLOAD_CHECKOUT"
          python3 .github/scripts/prepare_production_payload_bundle.py "$PAYLOAD_CHECKOUT" \
            | tee "$RUNNER_TEMP/production-payload-provenance.txt"
          ROOT_HELPER_SHA256="$(grep '^helper_sha256=' "$RUNNER_TEMP/production-payload-provenance.txt" | cut -d= -f2)"
          test -n "$ROOT_HELPER_SHA256"
          test "$(sha256sum app/src/main/jniLibs/arm64-v8a/libcve43499root.so | awk '{print $1}')" = "$ROOT_HELPER_SHA256"
          test -s app/src/main/assets/production-payloads/targets-v3.json
          rm -rf "$PAYLOAD_CHECKOUT"

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and assemble release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease
