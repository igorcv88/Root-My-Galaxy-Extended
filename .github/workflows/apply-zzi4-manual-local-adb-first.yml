name: Apply ZZI4 Manual Local ADB priority

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-zzi4-manual-local-adb-first.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply transport policy patch
        run: python3 tools/apply-zzi4-manual-local-adb-first.py

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and assemble release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease

      - name: Commit validated transport fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt \
            app/src/test/java/dev/busung/s25uroot/ManualShellTransportPolicyTest.kt
          git diff --cached --check
          git commit -m 'Pin ZZI4 Manual root to Local ADB shell'
          git push
