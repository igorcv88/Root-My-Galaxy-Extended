name: Fix ZZI4 pre-stage verification

on:
  push:
    branches:
      - fix/zzi4-prestage-verification

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zzi4-prestage-verification
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch quote-safe KernelSU pre-stage verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(path, start_marker, end_marker, replacement):
              p = Path(path)
              s = p.read_text()
              start = s.index(start_marker)
              end = s.index(end_marker, start)
              s = s[:start] + replacement + s[end:]
              p.write_text(s)

          replace_between(
              'app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt',
              '        val verifyCommand =\n',
              '        val verification = when (runTransport()) {\n',
              '''        val verifyCommand =
              "set -e; " +
                  "/system/bin/toybox sha256sum ${shellQuote(SHIZUKU_KSUD_PATH)} | " +
                  "/system/bin/toybox cut -d ' ' -f 1; " +
                  "/system/bin/toybox wc -c < ${shellQuote(SHIZUKU_KSUD_PATH)}"

          ''',
          )

          replace_between(
              'app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt',
              '    private fun zzi4KernelSuVerifyCommand(): String =\n',
              '    private fun verifyZzi4KernelSuPreStage(\n',
              '''    private fun zzi4KernelSuVerifyCommand(): String =
          "set -e; " +
              "/system/bin/toybox sha256sum ${shellQuote(KSUD_PATH)} | " +
              "/system/bin/toybox cut -d ' ' -f 1; " +
              "/system/bin/toybox wc -c < ${shellQuote(KSUD_PATH)}"

          ''',
          )

          test = Path('app/src/test/java/dev/busung/s25uroot/Zzi4PrestageVerificationCommandTest.kt')
          test.write_text('''package dev.busung.s25uroot

          import java.io.File
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class Zzi4PrestageVerificationCommandTest {
              @Test
              fun manualAndAutoRootUseQuoteSafeRemoteVerification() {
                  val manual = File("src/main/java/dev/busung/s25uroot/InstallViewModel.kt").readText()
                  val autoRoot = File("src/main/java/dev/busung/s25uroot/AutoRootRunner.kt").readText()

                  for (source in listOf(manual, autoRoot)) {
                      assertTrue(source.contains("/system/bin/toybox cut -d ' ' -f 1"))
                      assertFalse(source.contains("/system/bin/toybox awk"))
                  }
              }

              @Test
              fun remoteArtifactParserAcceptsHashAndSizeOnSeparateLines() {
                  val sha = "d76b44c984b8d6f7121f712d8aa4e7cf0178ff36a8cd531bddaca9dd2fd361e2"
                  assertTrue(remoteArtifactMatches("$sha\\n6664656", sha, 6664656L))
              }
          }
          '''.replace("          ", ""))
          PY

      - name: Source invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n "toybox awk" app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          ! grep -n "toybox awk" app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          grep -n "toybox cut -d ' ' -f 1" app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          grep -n "toybox cut -d ' ' -f 1" app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt

      - name: Gradle validation
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-zzi4-prestage-verification.yml
          git add app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt \
                  app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt \
                  app/src/test/java/dev/busung/s25uroot/Zzi4PrestageVerificationCommandTest.kt
          git commit -m 'Fix ZZI4 KernelSU pre-stage verification command'
          git push origin HEAD:fix/zzi4-prestage-verification
