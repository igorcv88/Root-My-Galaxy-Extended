name: Apply ZZI4 post-root notification fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-zzi4-postroot-notification-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply patch
        run: python3 tools/apply-zzi4-postroot-notification-fix.py

      - name: Verify intended contracts
        run: |
          set -euo pipefail
          ! grep -R -F '/system/bin/toybox awk' app/src/main/java/dev/busung/s25uroot/Zzi4PostRootRuntime.kt
          ! grep -F "awk 'NR == 1" app/src/main/java/dev/busung/s25uroot/PostRootModuleKeeper.kt
          grep -F 'ACTION_APPLY_MODULES_SOFT_REBOOT' app/src/main/java/dev/busung/s25uroot/AutoRootBootReceiver.kt
          grep -F 'EXTRA_OFFER_SOFT_REBOOT' app/src/main/java/dev/busung/s25uroot/AutoRootService.kt
          grep -F 'softReboot = softRebootAfterRoot' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          git diff --check

      - name: Test lint assemble
        run: |
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease

      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/dev/busung/s25uroot/Zzi4PostRootRuntime.kt \
            app/src/main/java/dev/busung/s25uroot/PostRootModuleKeeper.kt \
            app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt \
            app/src/main/java/dev/busung/s25uroot/AutoRootExecutorService.kt \
            app/src/main/java/dev/busung/s25uroot/AutoRootService.kt \
            app/src/main/java/dev/busung/s25uroot/AutoRootBootReceiver.kt \
            app/src/main/java/dev/busung/s25uroot/MainActivity.kt \
            app/src/main/java/dev/busung/s25uroot/AppPreferences.kt \
            app/src/main/res/values/strings_recovery.xml \
            app/src/main/res/values-pt-rBR/strings_recovery.xml \
            app/src/main/res/values/strings_autoroot.xml \
            app/src/main/res/values-pt-rBR/strings_autoroot.xml \
            app/src/test/java/dev/busung/s25uroot/Zzi4PostRootRuntimeTest.kt
          git commit -m 'Use user-initiated soft reboot for ZZI4 post-root modules'
          git push
