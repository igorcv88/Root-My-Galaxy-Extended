name: Fill Auto Root Warning Translations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fill-autoroot-warning-translations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add localized Auto Root warning strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          translations = {
              'values-fr': (
                  'Auto Root armé',
                  'Auto Root est activé, mais il ne fonctionnera qu’après une exécution Manual Online réussie ayant enregistré un cache de payload vérifié.',
              ),
              'values-ja': (
                  'Auto Root は準備完了',
                  'Auto Root は有効ですが、Manual Online が一度正常に完了して検証済みペイロードキャッシュが保存されるまで実行されません。',
              ),
              'values-ko': (
                  'Auto Root 준비됨',
                  'Auto Root는 활성화되어 있지만 Manual Online이 한 번 성공하여 검증된 페이로드 캐시를 저장할 때까지 실행되지 않습니다.',
              ),
              'values-ru': (
                  'Auto Root готов',
                  'Auto Root включён, но не запустится, пока Manual Online хотя бы один раз не завершится успешно и не сохранит проверенный кэш payload.',
              ),
              'values-tr': (
                  'Auto Root hazır',
                  'Auto Root etkin, ancak Manual Online bir kez başarıyla tamamlanıp doğrulanmış payload önbelleğini kaydedene kadar çalışmaz.',
              ),
              'values-uz': (
                  'Auto Root tayyor',
                  'Auto Root yoqilgan, lekin Manual Online bir marta muvaffaqiyatli yakunlanib, tekshirilgan payload keshini saqlamaguncha ishlamaydi.',
              ),
              'values-vi': (
                  'Auto Root đã sẵn sàng',
                  'Auto Root đã được bật nhưng sẽ chưa chạy cho đến khi Manual Online hoàn tất thành công một lần và lưu bộ nhớ đệm payload đã được xác minh.',
              ),
              'values-zh-rCN': (
                  'Auto Root 已就绪',
                  'Auto Root 已启用，但在 Manual Online 至少成功完成一次并保存经过验证的 payload 缓存之前不会运行。',
              ),
              'values-zh-rTW': (
                  'Auto Root 已就緒',
                  'Auto Root 已啟用，但在 Manual Online 至少成功完成一次並儲存經過驗證的 payload 快取之前不會執行。',
              ),
          }

          for folder, (title, body) in translations.items():
              path = Path('app/src/main/res') / folder / 'strings_autoroot.xml'
              text = path.read_text()
              if 'name="autoroot_not_ready_title"' in text:
                  continue
              insertion = (
                  f'    <string name="autoroot_not_ready_title">{title}</string>\n'
                  f'    <string name="autoroot_not_ready_body">{body}</string>\n'
              )
              if '</resources>\n' not in text:
                  raise SystemExit(f'missing resources terminator: {path}')
              path.write_text(text.replace('</resources>\n', insertion + '</resources>\n', 1))
          PY

          rm -f .github/workflows/fill-autoroot-warning-translations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Translate Auto Root readiness warning"
          git push
