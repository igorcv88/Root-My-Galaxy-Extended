name: Apply ZZI4 strict tracefs app route

on:
  push:
    branches:
      - zzi4-tracefs-strict
    paths:
      - .github/workflows/apply-zzi4-tracefs-strict.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zzi4-tracefs-strict-app
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v6
        with:
          ref: zzi4-tracefs-strict
          fetch-depth: 0

      - name: Patch exact ZZI4 manual route
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt')
          text = path.read_text()

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          once(
              '                executeExploit(payloads.exploit)\n',
              '                executeExploit(payloads.exploit, profile.profileId)\n',
              'profile-aware executeExploit call',
          )
          once(
              '    private suspend fun executeExploit(payload: File) {\n        val shizuku = shizukuEnabled()\n',
              '    private suspend fun executeExploit(payload: File, profileId: String) {\n        val strictTracefs = profileId == TRACEFS_ZZI4_PROFILE\n        val shizuku = shizukuEnabled()\n        if (strictTracefs) {\n            require(shizuku) { "Exact ZZI4 tracefs route requires Shizuku shell transport" }\n            appendLog("[*] exploit route=tracefs-strict attempts=$TRACEFS_EXPLOIT_ATTEMPTS p0_fallback=off")\n        }\n',
              'strict tracefs prologue',
          )

          old_shizuku = '''        val process = if (shizuku) {
            val stagedPayload = shizukuStage(payload, SHIZUKU_PAYLOAD_PATH, "755")
            ShizukuController.exec(
                arrayOf("/system/bin/sh", "-c", "true"),
                shizukuEnvironment(bootToken, stagedPayload.absolutePath, helper.absolutePath),
            )
        } else {
'''
          new_shizuku = '''        val process = if (shizuku) {
            val stagedPayload = shizukuStage(payload, SHIZUKU_PAYLOAD_PATH, "755")
            ShizukuController.exec(
                arrayOf(
                    helper.absolutePath,
                    "--run-payload",
                    stagedPayload.absolutePath,
                    helper.absolutePath,
                    SHIZUKU_LOG_PATH,
                ),
                shizukuEnvironment(bootToken, helper.absolutePath, strictTracefs),
                "/data/local/tmp",
            )
        } else {
'''
          once(old_shizuku, new_shizuku, 'Shizuku helper runner')

          old_env = '''            processBuilder.environment().apply {
                put("EXPLOIT_ATTEMPTS", EXPLOIT_ATTEMPTS)
                put("P0_ATTEMPT_TIMEOUT_SEC", P0_ATTEMPT_TIMEOUT_SEC)
                put("EXPLOIT_ATTEMPT_TIMEOUT_SEC", EXPLOIT_ATTEMPT_TIMEOUT_SEC)
                cachedP0Offset(bootToken)?.let { put(P0_OFFSET_ENV, it) }
            }
'''
          new_env = '''            processBuilder.environment().apply {
                put(
                    "EXPLOIT_ATTEMPTS",
                    if (strictTracefs) TRACEFS_EXPLOIT_ATTEMPTS else EXPLOIT_ATTEMPTS,
                )
                put("EXPLOIT_ATTEMPT_TIMEOUT_SEC", EXPLOIT_ATTEMPT_TIMEOUT_SEC)
                if (strictTracefs) {
                    put("SLIDE_SOURCE", "tracefs")
                } else {
                    put("P0_ATTEMPT_TIMEOUT_SEC", P0_ATTEMPT_TIMEOUT_SEC)
                    cachedP0Offset(bootToken)?.let { put(P0_OFFSET_ENV, it) }
                }
            }
'''
          once(old_env, new_env, 'standalone strict env')

          text = text.replace(
              '                    cacheP0Offset(bootToken, rawLog)\n',
              '                    if (!strictTracefs) cacheP0Offset(bootToken, rawLog)\n',
          )
          text = text.replace(
              '            cacheP0Offset(bootToken, rawLog)\n',
              '            if (!strictTracefs) cacheP0Offset(bootToken, rawLog)\n',
          )

          old_fn = '''    private fun shizukuEnvironment(
        bootToken: String?,
        payloadPath: String,
        helperPath: String,
    ): Array<String> = buildList {
        add("EXPLOIT_ATTEMPTS=$EXPLOIT_ATTEMPTS")
        add("P0_ATTEMPT_TIMEOUT_SEC=$P0_ATTEMPT_TIMEOUT_SEC")
        add("EXPLOIT_ATTEMPT_TIMEOUT_SEC=$EXPLOIT_ATTEMPT_TIMEOUT_SEC")
        add("CVE43499_ROOT_HELPER=$helperPath")
        add("LD_PRELOAD=$payloadPath")
        cachedP0Offset(bootToken)?.let { add("$P0_OFFSET_ENV=$it") }
    }.toTypedArray()
'''
          new_fn = '''    private fun shizukuEnvironment(
        bootToken: String?,
        helperPath: String,
        strictTracefs: Boolean,
    ): Array<String> = buildList {
        add(
            "EXPLOIT_ATTEMPTS=" +
                if (strictTracefs) TRACEFS_EXPLOIT_ATTEMPTS else EXPLOIT_ATTEMPTS,
        )
        add("EXPLOIT_ATTEMPT_TIMEOUT_SEC=$EXPLOIT_ATTEMPT_TIMEOUT_SEC")
        add("CVE43499_ROOT_HELPER=$helperPath")
        if (strictTracefs) {
            add("SLIDE_SOURCE=tracefs")
        } else {
            add("P0_ATTEMPT_TIMEOUT_SEC=$P0_ATTEMPT_TIMEOUT_SEC")
            cachedP0Offset(bootToken)?.let { add("$P0_OFFSET_ENV=$it") }
        }
    }.toTypedArray()
'''
          once(old_fn, new_fn, 'Shizuku strict environment')

          once(
              '        private const val EXPLOIT_ATTEMPTS = "24"\n',
              '        private const val TRACEFS_ZZI4_PROFILE = "pa3q-S938BXXUCZZI4"\n        private const val TRACEFS_EXPLOIT_ATTEMPTS = "4"\n        private const val EXPLOIT_ATTEMPTS = "24"\n',
              'strict route constants',
          )

          path.write_text(text)
          PY

      - name: Verify route wiring
        run: |
          set -euo pipefail
          file=app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          grep -F 'exploit route=tracefs-strict attempts=$TRACEFS_EXPLOIT_ATTEMPTS p0_fallback=off' "$file"
          grep -F 'put("SLIDE_SOURCE", "tracefs")' "$file"
          grep -F '"--run-payload"' "$file"
          grep -F 'private const val TRACEFS_EXPLOIT_ATTEMPTS = "4"' "$file"
          if grep -A10 -F 'private fun shizukuEnvironment(' "$file" | grep -F 'LD_PRELOAD='; then
            echo 'Shizuku route still uses direct LD_PRELOAD instead of helper runner' >&2
            exit 1
          fi
          git diff --check

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test lint and assemble
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Commit strict ZZI4 route
        run: |
          set -euo pipefail
          git config user.name 'Root My Galaxy'
          git config user.email 'root-my-galaxy@users.noreply.github.com'
          git add app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'Use strict tracefs route for exact ZZI4 profile'
          git push origin HEAD:zzi4-tracefs-strict
