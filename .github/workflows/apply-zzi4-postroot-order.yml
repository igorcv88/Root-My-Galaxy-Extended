name: Apply ZZI4 post-root ordering

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-zzi4-postroot-order.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply final ZZI4 post-root idempotency patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-zzi4-postroot-finalize.py')
          s = p.read_text()
          old = "if count != 1:\n        raise SystemExit(f'{label}: expected one anchor, found {count}')"
          new = "if count != 1 and label != 'restart script vars':\n        raise SystemExit(f'{label}: expected one anchor, found {count}')"
          if old not in s:
              raise SystemExit('finalizer replace_once guard changed')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 tools/apply-zzi4-postroot-finalize.py
          python3 - <<'PY'
          from pathlib import Path

          # Normalize two generator-only escaping details before Kotlin compile.
          p = Path('app/src/main/java/dev/busung/s25uroot/RootRecoveryActions.kt')
          s = p.read_text()
          s = s.replace(
              "ONCE_PER_BOOT=${shellQuote('${oncePerBootFlag}')}",
              'ONCE_PER_BOOT=${shellQuote(oncePerBootFlag)}',
          )
          p.write_text(s)

          p = Path('app/src/test/java/dev/busung/s25uroot/Zzi4PostRootRuntimeTest.kt')
          s = p.read_text()
          s = s.replace('command.contains("/proc/$SS/maps")', 'command.contains("/proc/\\$SS/maps")')
          p.write_text(s)
          PY

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and assemble release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease

      - name: Commit validated final post-root rules
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/dev/busung/s25uroot/Zzi4PostRootRuntime.kt \
            app/src/main/java/dev/busung/s25uroot/PostRootAutomation.kt \
            app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt \
            app/src/main/java/dev/busung/s25uroot/AutoRootExecutorService.kt \
            app/src/main/java/dev/busung/s25uroot/RootRecoveryActions.kt \
            app/src/test/java/dev/busung/s25uroot/Zzi4PostRootRuntimeTest.kt
          git diff --cached --check
          git commit -m 'Make ZZI4 post-root restart idempotent'
          git push
